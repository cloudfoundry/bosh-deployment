---

# Apply deployment tags to every instance in the deployment.
#
# The BOSH Director forwards deployment tags to the CPI as instance metadata.
# On GCP the google CPI surfaces them as resource labels, which makes them
# visible in billing/cost reports; other CPIs map them onto their own resource
# metadata (for example AWS EC2 tags).
#
# Usage:
#
#   bosh deploy ... -o misc/tags.yml \
#     -v 'deployment_tags={"pipeline":"bosh-deployment","environment":"my-env"}'
#
# or supply a vars file:
#
#   # tags.yml
#   deployment_tags:
#     pipeline: bosh-deployment
#     environment: my-env
#
#   bosh deploy ... -o misc/tags.yml --vars-file tags.yml
#
# The variable is named `deployment_tags` rather than `tags` because `tags` is
# already used by the CPI ops files (for example gcp/cpi.yml) for VM network
# tags. Any tags defined directly in the deployment manifest are replaced by
# this ops file.

- type: replace
  path: /tags?
  value: ((deployment_tags))
