- path: /releases/name=os-conf?
  release: os-conf
  type: replace
  value:
    name: os-conf
    sha1: 0d16b6133a7931cc1cb721a39d43e97a9408c506
    url: https://bosh.io/d/github.com/cloudfoundry/os-conf-release?v=23.0.4
    version: 23.0.4
- path: /instance_groups/0/properties/director/default_ssh_options?/gateway_user
  type: replace
  value: jumpbox
- path: /instance_groups/0/jobs/-
  type: replace
  value:
    name: user_add
    properties:
      users:
      - name: jumpbox
        public_key: ((jumpbox_ssh.public_key))
    release: os-conf
- path: /variables/-
  type: replace
  value:
    name: jumpbox_ssh
    type: ssh
