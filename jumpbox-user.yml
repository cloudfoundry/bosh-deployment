- path: /releases/name=os-conf?
  release: os-conf
  type: replace
  value:
    name: os-conf
    sha1: 9f5db956e66005b67ed0b5b5b0949f9a7a1c60c9
    url: https://bosh.io/d/github.com/cloudfoundry/os-conf-release?v=23.0.2
    version: 23.0.2
- path: /instance_groups/0/properties/director/default_ssh_options?/gateway_user
  type: replace
  value: jumpbox
- path: /instance_groups/0/jobs/-
  type: replace
  value:
    name: user_add
    properties:
      users:
      - name: jumpbox
        public_key: ((jumpbox_ssh.public_key))
    release: os-conf
- path: /variables/-
  type: replace
  value:
    name: jumpbox_ssh
    type: ssh
