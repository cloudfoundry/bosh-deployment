- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: 1ef3689250d29bfda92156575d545a369cea2225
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.28
    version: 12.3.28
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
