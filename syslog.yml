- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: bc200308f5ed0a7d06dcc063244fad754e4e1e4b
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.27
    version: 12.3.27
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
