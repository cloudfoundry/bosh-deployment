- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: 64f9962fbb858f6b686c5ab05e60d91243cce6b6
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.32
    version: 12.3.32
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
