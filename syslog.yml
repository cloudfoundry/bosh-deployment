- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: b767d99d2e30cd4f66cffee24354195595fd51c4
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.29
    version: 12.3.29
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
