- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: 1afdb207b5e32b1a93a5b3ae2e1b32fdf8d7f88d
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.30
    version: 12.3.30
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
