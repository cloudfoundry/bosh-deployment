- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: bc9dcfbb376274b2bd8b98ede7cd32f562bd9f54
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.31
    version: 12.3.31
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
