- path: /releases/-
  release: syslog
  type: replace
  value:
    name: syslog
    sha1: 4f6702f741ffdec4b551bcfcce1778f891ece0c9
    url: https://bosh.io/d/github.com/cloudfoundry/syslog-release?v=12.3.33
    version: 12.3.33
- path: /instance_groups/name=bosh/jobs/-
  type: replace
  value:
    name: syslog_forwarder
    properties:
      syslog:
        address: ((syslog_address))
        port: ((syslog_port))
        transport: ((syslog_transport))
    release: syslog
