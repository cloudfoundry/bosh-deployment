---
platform: linux

image_resource:
  type: registry-image
  source:
    repository: cloudfoundry/cf-deployment-concourse-tasks

inputs:
  - name: bosh-deployment

outputs:
  - name: bbl-state

params:
  BBL_GCP_SERVICE_ACCOUNT_KEY: replace-me
  BBL_IAAS: gcp
  BBL_GCP_REGION: replace-me
  DIRECTOR_OPS_FILES: "" # Space-separated, repo-relative ops files applied to the director

run:
  path: bosh-deployment/ci/tasks/bbl-up-bosh-gcp.sh
