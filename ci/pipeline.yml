  - compile-bosh-release-resolute
  - compile-bpm-release-resolute
  - compile-credhub-release-resolute
  - compile-docker-cpi-resolute
  - compile-garden-runc-resolute
  - compile-uaa-release-resolute
  - compile-warden-cpi-resolute
- name: update-source-releases
  jobs:
  - update-dns-release
  - update-os-conf-release
  - update-syslog-release

jobs:
- name: test-noble-gcp
  old_name: test-bosh-gcp
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - do:
    - in_parallel:
      - get: bosh-deployment
        trigger: true
      - get: gcp-ubuntu-noble-stemcell
    - task: bbl-up
      file: bosh-deployment/ci/tasks/bbl-up-bosh-gcp.yml
      params:
        BBL_GCP_SERVICE_ACCOUNT_KEY: ((gcp_json_key))
        BBL_GCP_REGION: *bbl_gcp_region
    - task: test-gcp
      file: bosh-deployment/ci/tasks/test-gcp.yml
      input_mapping:
        stemcell: gcp-ubuntu-noble-stemcell
      params:
        STEMCELL_OS: ubuntu-noble
    ensure:
      task: bbl-down
      file: bosh-deployment/ci/tasks/bbl-down-bosh-gcp.yml
      params:
        BBL_GCP_SERVICE_ACCOUNT_KEY: ((gcp_json_key))
        BBL_GCP_REGION: *bbl_gcp_region

- name: test-smoke
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - get: bosh-deployment
    trigger: true
  - task: test-smoke
    file: bosh-deployment/ci/tasks/test-smoke.yml

- name: test-noble-warden
  old_name: test-main-warden-cpi
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - in_parallel:
    - get: bosh-deployment
      trigger: true
    - get: warden-ubuntu-noble-stemcell
    - get: bosh-warden-cpi-image
  - task: test-warden
    timeout: 2h
    file: bosh-deployment/ci/tasks/test-warden.yml
    image: bosh-warden-cpi-image
    input_mapping:
      stemcell: warden-ubuntu-noble-stemcell
    privileged: true
    params:
      STEMCELL_OS: ubuntu-noble

- name: test-noble-docker
  old_name: test-main-docker-cpi
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - in_parallel:
    - get: bosh-deployment
      trigger: true
    - get: warden-ubuntu-noble-stemcell
    - get: bosh-docker-cpi-image
  - task: test-docker
    timeout: 2h
    file: bosh-deployment/ci/tasks/test-docker.yml
    image: bosh-docker-cpi-image
    input_mapping:
      stemcell: warden-ubuntu-noble-stemcell
    privileged: true
    params:
      STEMCELL_OS: ubuntu-noble

- name: test-resolute-gcp
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - do:
    - in_parallel:
      - get: bosh-deployment
        trigger: true
      - get: gcp-ubuntu-resolute-stemcell
    - task: bbl-up
      file: bosh-deployment/ci/tasks/bbl-up-bosh-gcp.yml
      params:
        BBL_GCP_SERVICE_ACCOUNT_KEY: ((gcp_json_key))
        BBL_GCP_REGION: *bbl_gcp_region
        DIRECTOR_OPS_FILES: "gcp/use-resolute.yml misc/use-compiled-resolute-releases.yml"
    - task: test-gcp
      file: bosh-deployment/ci/tasks/test-gcp.yml
      input_mapping:
        stemcell: gcp-ubuntu-resolute-stemcell
      params:
        STEMCELL_OS: ubuntu-resolute
    ensure:
      task: bbl-down
      file: bosh-deployment/ci/tasks/bbl-down-bosh-gcp.yml
      params:
        BBL_GCP_SERVICE_ACCOUNT_KEY: ((gcp_json_key))
        BBL_GCP_REGION: *bbl_gcp_region

- name: test-resolute-warden
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - in_parallel:
    - get: bosh-deployment
      trigger: true
    - get: warden-ubuntu-resolute-stemcell
    - get: bosh-warden-cpi-image
  - task: test-warden
    timeout: 2h
    file: bosh-deployment/ci/tasks/test-warden.yml
    image: bosh-warden-cpi-image
    input_mapping:
      stemcell: warden-ubuntu-resolute-stemcell
    privileged: true
    params:
      DIRECTOR_OPS_FILES: "warden/use-resolute.yml misc/use-compiled-resolute-releases.yml"
      STEMCELL_OS: ubuntu-resolute

- name: test-resolute-docker
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - in_parallel:
    - get: bosh-deployment
      trigger: true
    - get: warden-ubuntu-resolute-stemcell
    - get: bosh-docker-cpi-image
  - task: test-docker
    timeout: 2h
    file: bosh-deployment/ci/tasks/test-docker.yml
    image: bosh-docker-cpi-image
    input_mapping:
      stemcell: warden-ubuntu-resolute-stemcell
    privileged: true
    params:
      DIRECTOR_OPS_FILES: "docker/use-resolute.yml misc/use-compiled-resolute-releases.yml"
      STEMCELL_OS: ubuntu-resolute

- name: promote
  serial: true
  build_log_retention:
    builds: 250
  plan:
  - get: bosh-deployment
    trigger: true
    passed:
    - test-smoke
    - test-noble-gcp
    - test-noble-warden
    - test-noble-docker
  - put: bosh-deployment-commit-status
    params:
      state: success
      commit: bosh-deployment
  - put: bosh-deployment-master
    params:
      repository: bosh-deployment

### CPIs

