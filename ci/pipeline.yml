---
yaml_anchors:
- &bbl_gcp_region europe-west1
- &on-failure-echo
  on_failure:
    task: echo-skip-message
    file: bosh-deployment/ci/tasks/echo-skip-upload-message.yml
- &commit-when-new-asset
  try:
    do:
    - task: is-there-new-asset
      file: bosh-deployment/ci/tasks/is-there-new-asset.yml
      on_success:
        do:
          - put: bosh-deployment
            params:
              repository: bosh-deployment
              rebase: true
      <<: *on-failure-echo
- &commit-and-upload-when-new-release
  try:
    do:
    - task: is-there-new-asset
      file: bosh-deployment/ci/tasks/is-there-new-asset.yml
      on_success:
        do:
          - put: compiled-releases
            no_get: true
            params:
              file: "compiled-release/*.tgz"
          - put: bosh-deployment
            params:
              repository: bosh-deployment
              rebase: true
      <<: *on-failure-echo

groups:
- name: bosh-deployment
  jobs:
  - test-noble-gcp
  - test-smoke
  - test-noble-warden
  - test-noble-docker
  - test-resolute-gcp
  - test-resolute-warden
  - test-resolute-docker
  - promote
- name: cpis
  jobs:
  - update-aws-cpi
  - update-docker-cpi-release
  - update-google-cpi
  - update-azure-cpi
  - update-alicloud-cpi
  - update-vsphere-cpi-release
  - update-virtualbox-cpi-release
  - update-openstack-cpi-release
  - update-warden-cpi-release
- name: bump-stemcells-noble
  jobs:
  - update-aws-noble-stemcell
  - update-alicloud-noble-stemcell
  - update-azure-noble-stemcell
  - update-docker-noble-stemcell
  - update-gcp-noble-stemcell
  - update-openstack-noble-stemcell
  - update-openstack-raw-noble-stemcell
  - update-vcloud-noble-stemcell
  - update-virtualbox-noble-stemcell
  - update-vsphere-noble-stemcell
  - update-warden-noble-stemcell
- name: bump-stemcells-jammy
